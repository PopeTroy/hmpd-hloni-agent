name: HMPD Agentic Engine V3.0 - Quantum Coalition

on:
  repository_dispatch:
    types: [dossier_finalized]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quantum_structural_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq openai fpdf2

      - name: Execute 80-Agent Coalition Diagnostic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          USER_PAYLOAD: ${{ github.event.client_payload != null && toJson(github.event.client_payload) || '{"details":"Manual Check", "transaction_id":"manual"}' }}
        run: python hloni_engine.py

      - name: Commit and Push Unique Audit & Quote
        run: |
          git config --global user.name "Hloni-Quantum-Agent"
          git config --global user.email "agent@hmpd.co.za"
          git add *.json *.pdf
          git commit -m "Quantum Audit & Quote Generated [skip ci]" || echo "No changes"
          git push
